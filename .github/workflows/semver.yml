# SPDX-License-Identifier: MIT OR Apache-2.0
name: Semver

# Checks springrep against its latest release on crates.io. The check takes the release type from
# the version in Cargo.toml, so a breaking change fails unless that version is a major bump.
on:
  pull_request:
    paths: [src/**, Cargo.toml, .github/workflows/semver.yml]

permissions:
  contents: read

jobs:
  springrep:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: obi1kenobi/cargo-semver-checks-action@6b69fcf40e9b5fb17adeb57e4b6ecd020649a239 # v2.9
        with:
          package: springrep
