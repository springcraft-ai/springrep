# Builds site/ and publishes it to GitHub Pages on each push to main that changes the page.
name: pages

on:
  push:
    branches: [main]
    paths:
      - site/**
      - examples/bracket.rs
      - src/**
      - Cargo.toml
      - rust-toolchain.toml
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: python3 site/build.py
      - run: mv site/dist/springrep.html site/dist/index.html
      # springrep is not on crates.io, so docs.rs has no page: the API docs are served from here.
      - run: rustup show active-toolchain || rustup toolchain install
      - run: cargo doc --no-deps --locked
      - run: cp -r target/doc site/dist/api
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
