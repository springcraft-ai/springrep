# Builds site/ and publishes it to GitHub Pages on each push to main that changes the page, and once
# a day so the leaderboard the build writes into the page follows brep-conformance's latest run.
name: pages

on:
  push:
    branches: [main]
    paths:
      - site/**
      - examples/bracket.rs
      - Cargo.toml
      - .github/workflows/pages.yml
  schedule:
    - cron: "23 7 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: python3 site/build.py
      - run: mv site/dist/springrep.html site/dist/index.html
      - run: rm site/dist/leaderboard.json
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
