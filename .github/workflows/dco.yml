# SPDX-License-Identifier: MIT
name: DCO

on:
  pull_request:

permissions:
  pull-requests: read

jobs:
  sign-off:
    runs-on: ubuntu-latest
    steps:
      - name: Every commit carries a Signed-off-by line
        env:
          GH_TOKEN: ${{ github.token }}
          COMMITS:
            repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/commits
        run: |
          unsigned="$(gh api --paginate "$COMMITS" --jq '
            .[]
            | select(.commit.message | test("(^|\n)Signed-off-by: [^\n]+ <[^\n ]+@[^\n ]+>") | not)
            | "\(.sha[0:7]) \(.commit.message | split("\n")[0])"')"
          if [ -n "$unsigned" ]; then
              echo "These commits have no Signed-off-by line:"
              echo "$unsigned"
              echo "Sign them with: git rebase --signoff main"
              echo ".github/CONTRIBUTING.md says what the line certifies."
              exit 1
          fi
          echo "Every commit is signed off."
