# SPDX-License-Identifier: MIT
name: Licenses

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  cargo-deny:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CARGO_DENY_VERSION: 0.21.0
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master, 2026-09-12
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: cargo-deny-${{ env.CARGO_DENY_VERSION }}
      - name: Install cargo-deny
        run: cargo install --locked cargo-deny --version "$CARGO_DENY_VERSION"
      - name: Every dependency has a permissive licence and comes from crates.io
        run: cargo deny --all-features check licenses sources
