# The licence policy for dependencies, checked with `cargo deny check licenses sources`.

[graph]
all-features = true

# Permissive licences only. cargo-deny refuses every licence that is not listed, so the GPL, the
# LGPL, the AGPL and the MPL are refused by not being here.
[licenses]
version = 2
confidence-threshold = 0.93
# The list is the policy, not a record of what the tree uses today.
unused-allowed-license = "allow"
allow = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "ISC",
    "MIT",
    "MIT-0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]

[licenses.private]
ignore = true

# A dependency comes from crates.io. A git or path source outside this workspace has no registry
# record of its licence or its contents.
[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
